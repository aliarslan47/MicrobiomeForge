[project]
name = "microbiomeforge"
version = "0.1.0"
description = "nf-core ham çıktısından karşılaştırmalı, istatistiksel, literatüre atıflı mikrobiyom raporu üreten katman"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ali Arslan", email = "aliarslan47@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-bio>=0.6",
    "scikit-posthocs>=0.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "biopython>=1.83",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
microbiomeforge = "microbiomeforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["microbiomeforge*"]

[tool.setuptools.package-data]
microbiomeforge = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
